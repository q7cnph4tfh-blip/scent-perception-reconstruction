const PRODUCTS=[{"name": "夏日离别练习", "top": "绿叶、杏子", "heart": "栀子、茉莉、奶油", "base": "香草、麝香"}, {"name": "一叶扁舟", "top": "绿叶、木兰", "heart": "绿茶、水生花、茉莉", "base": "木香、苔香、雪松"}, {"name": "一碗月光", "top": "芳香、绿意、柑橘调", "heart": "雪松、花香、松木", "base": "木质、琥珀"}, {"name": "银河系中心调杯酒", "top": "柠檬、罗勒、丁香、蓝莓", "heart": "茉莉、玫瑰、薰衣草", "base": "麝香、广藿香、黑香豆"}, {"name": "当萨特与海德格尔干杯", "top": "柠檬、柑橘", "heart": "葡萄、浆果、莓果", "base": "雪松、香草、铃兰"}, {"name": "点香化堂前风", "top": "薰衣草、松木、琥珀", "heart": "烟熏感、皮革", "base": "雪松、木质香、苔藓"}, {"name": "走到桂花落肩头", "top": "绿叶、柑橘", "heart": "桂花、黄杏", "base": "黄葵子、雪松"}];
const CN={brightness:"明亮",warmth:"暖感",wetness:"湿润",sweetness:"甜润",greenness:"青绿",floral:"花香",fruity:"果香",woody:"木质",smoky:"烟熏",musky:"麝香/肌肤",creamy:"奶油感",powderiness:"脂粉感",airiness:"通透"};
const TCN={soapy:"皂感",waxy:"蜡感",resinous:"树脂感",medicinal:"药感",boozy:"酒感"};
const W={top:.30,heart:.45,base:.25};

function splitNotes(s){return String(s||"").replace(/[，、/|]/g,",").split(",").map(v=>v.trim()).filter(Boolean)}
function averageNotes(list){
  const known=list.filter(n=>Array.isArray(O[n])), unknown=list.filter(n=>!Array.isArray(O[n]));
  const main=Array(DIMS.length).fill(0), tex=Array(TEX.length).fill(0);
  if(known.length){
    known.forEach(n=>{
      const a=O[n];
      DIMS.forEach((d,i)=>main[i]+=a[i]/known.length);
      TEX.forEach((d,i)=>tex[i]+=a[DIMS.length+i]/known.length);
    });
  }
  return {known,unknown,main,tex};
}
function label(v,a,b,c){return v<.34?a:(v<.67?b:c)}
function phaseText(a){return DIMS.map((d,i)=>[d,a[i]]).sort((a,b)=>b[1]-a[1]).slice(0,4).filter(x=>x[1]>=.35).map(x=>CN[x[0]]).join("、")||"整体较轻"}
function escapeHtml(s){return String(s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]))}
function texLevel(v){return v>=.68?"明显":v>=.45?"中等":"轻微"}

function buildTextureTags(texObj){
  const items=TEX.map(d=>[d,texObj[d]]).filter(x=>x[1]>=.28).sort((a,b)=>b[1]-a[1]);
  if(!items.length)return '<div style="color:#8e857c;font-size:13px;">没有特别突出的第二层材质标签。</div>';
  return '<div class="texture-tags">'+items.map(([d,v])=>`<div class="texture-tag"><strong>${TCN[d]}</strong><span>${texLevel(v)} · ${(v*10).toFixed(1)}</span></div>`).join("")+'</div>';
}

function makeFeedback(o,strong,texObj){
  let s=`这款香气首先给人的方向是${strong.slice(0,3).join("、")||"轻柔"}。`;
  if(o.floral>.65)s+=" 花香是明显主体。";
  if(o.fruity>.62)s+=" 果香存在感比较清楚。";
  if(o.woody>.58)s+=" 木质骨架比较明显。";
  if(o.greenness>.52)s+=" 有叶片、茶感或草本式青绿感。";
  if(o.smoky>.48)s+=" 会带烟熏、旧木或皮革式暗感。";
  if(o.powderiness>.52)s+=" 同时有明显脂粉/柔雾质地。";
  else if(o.powderiness>.34)s+=" 带一点轻微粉质柔雾。";
  const tx=TEX.map(d=>[d,texObj[d]]).sort((a,b)=>b[1]-a[1])[0];
  if(tx && tx[1]>=.45)s+=` 第二层材质里，${TCN[tx[0]]}会比较突出。`;
  return s;
}

function makeAnalogy(o,strong,texObj){
  if(o.powderiness>.58&&o.floral>.5)return "像打开一只旧式化妆粉盒：花香被磨成柔雾状，干爽、细腻，带一点贴肤的粉质感。";
  if(texObj.boozy>.5&&o.fruity>.45)return "像一杯带果香的低度调酒：有汁液感，也有一点发酵与酒气的联想。";
  if(texObj.resinous>.55&&o.woody>.45)return "像温热木材上残留的树脂与香脂，颜色偏深，质地更稠、更暖。";
  if(texObj.soapy>.5&&o.floral>.4)return "像刚洗净的白色织物和花瓣，带一点干净皂感。";
  if(texObj.medicinal>.45)return "像草本、辛香和药柜之间的交界，带一点清苦或药感。";
  if(o.smoky>.5&&o.woody>.5)return "像旧木空间里残留的烟与皮革，偏暗、偏干，材质感很强。";
  if(o.wetness>.6&&o.greenness>.45)return "像雨后植物、茶园或水边木头，带明显水汽与青绿感。";
  if(o.floral>.6&&o.fruity>.55)return "像花瓣和成熟果实叠在一起，明亮、柔软，带自然甜感。";
  if(o.woody>.6&&o.airiness>.45)return "像冷空气里的浅色木材或针叶林，木质但不闷。";
  if(o.fruity>.65)return "像刚打开的果汁、果酒或成熟浆果，果香是最直观的入口。";
  return "像一个由"+(strong.slice(0,3).join("、")||"轻柔香气")+"构成的整体气味场景。";
}

function generateScentFeedback(){
  try{
    const name=document.getElementById("productName").value;
    const p={
      top:averageNotes(splitNotes(document.getElementById("topNotes").value)),
      heart:averageNotes(splitNotes(document.getElementById("heartNotes").value)),

      p[k].main.forEach((v,i)=>overall[i]+=W[k]*v);
      p[k].tex.forEach((v,i)=>texOverall[i]+=W[k]*v);
    });
    const o=Object.fromEntries(DIMS.map((d,i)=>[d,overall[i]]));
    const tx=Object.fromEntries(TEX.map((d,i)=>[d,texOverall[i]]));
    const labels={
      temperature:label(o.warmth,"偏冷","中性","偏暖"),
      humidity:label(o.wetness,"偏干","中等","偏湿润"),
      brightness:label(o.brightness,"偏暗","中等","偏亮"),
      sweetness:label(o.sweetness,"低甜","微甜","偏甜"),
      airiness:label(o.airiness,"厚实","中等","通透")
    };
    const strong=DIMS.map((d,i)=>[d,overall[i]]).sort((a,b)=>b[1]-a[1]).slice(0,6).filter(x=>x[1]>=.38).map(x=>CN[x[0]]);
    const unknown=[...new Set([...p.top.unknown,...p.heart.unknown,...p.base.unknown])];
    const known=[...p.top.known,...p.heart.known,...p.base.known];
    const coverage=(known.length+unknown.length)?known.length/(known.length+unknown.length):0;
    const scene=`${labels.brightness}、${labels.temperature}、${labels.humidity}；主要呈现${strong.slice(0,4).join("、")||"轻柔香气"}，整体${labels.airiness}。`;

    document.getElementById("result").innerHTML=`
      <div class="hero">
        <h2 class="hero-title">${escapeHtml(name||"未命名香气")}</h2>
        <p class="hero-copy">${scene}</p>
        <div class="badges">
          <span class="badge">${labels.temperature}</span><span class="badge">${labels.humidity}</span>
          <span class="badge">${labels.brightness}</span><span class="badge">${labels.sweetness}</span>
          <span class="badge">${labels.airiness}</span><span class="badge">脂粉感 ${(o.powderiness*10).toFixed(1)}/10</span>
        </div>
      </div>

      <div class="section"><h3>第一感受</h3><div class="first">${makeFeedback(o,strong,tx)}</div></div>

      <div class="section"><h3>前 · 中 · 后</h3>
        <div class="timeline">
          <div class="phase"><div class="en">Top</div><b>前调</b>${phaseText(p.top.main)}</div>
          <div class="phase"><div class="en">Heart</div><b>中调</b>${phaseText(p.heart.main)}</div>
          <div class="phase"><div class="en">Base</div><b>后调</b>${phaseText(p.base.main)}</div>
        </div>
      </div>

      <div class="section"><h3>感知轮廓</h3>
        <div class="profile-grid">
          ${DIMS.map((d,i)=>`<div class="bar ${d==="powderiness"?"powder":""}">
            <span>${CN[d]}</span><div class="track"><div class="fill" style="width:${Math.round(overall[i]*100)}%"></div></div><span>${(overall[i]*10).toFixed(1)}</span>
          </div>`).join("")}
        </div>
      </div>

      <div class="section"><h3>Texture Tags · 第二层材质标签</h3><div class="texture-box">${buildTextureTags(tx)}</div></div>
      <div class="section"><h3>一句话像什么</h3><div class="analogy">${makeAnalogy(o,strong,tx)}</div></div>
      <div class="feedback-cta">
        <h3>你闻过实物吗？</h3>
        <p>如果你闻过这款香气，可以用真实闻感帮助我们校准模型。</p>
        <a class="feedback-link" href="https://www.wjx.top/vm/h4Fsb6n.aspx#" target="_blank" rel="noopener noreferrer">我闻过实物，匿名提交真实反馈 ↗</a>
        <div class="privacy-note">反馈仅用于匿名聚合分析和模型改进。请勿在自由文本中填写姓名、手机号、邮箱等个人敏感信息。</div>
      </div>
      <div class="meta">词库覆盖率：${Math.round(coverage*100)}%。当前结果用于帮助理解香调感知，不代表真实成分浓度。</div>
      ${unknown.length?`<div class="warn">未收录香调：${unknown.join("、")}</div>`:""}
    `;
  }catch(e){
    document.getElementById("result").innerHTML='<div class="warn">生成失败：'+escapeHtml(e&&e.message?e.message:String(e))+'</div>';
    console.error(e);
  }
}

const preset=document.getElementById("preset");
PRODUCTS.forEach((p,i)=>{const opt=document.createElement("option");opt.value=String(i);opt.textContent=p.name;preset.appendChild(opt)});
preset.onchange=function(){
  if(this.value==="")return;
  const p=PRODUCTS[Number(this.value)];
  document.getElementById("productName").value=p.name;
  document.getElementById("topNotes").value=p.top;
  document.getElementById("heartNotes").value=p.heart;
  document.getElementById("baseNotes").value=p.base;
  generateScentFeedback();
};
</script>
</body>
</html>
